name: 🐳 Build & Push to JFrog

on:
  push:
    branches: [develop]
    paths:
      - 'app.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/build-push-jfrog.yml'
  workflow_dispatch:

jobs:
  build-push:
    name: 🔨 Build & Push Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 📋 Get version from package.json
        id: package
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | grep -oP '"\K[^"]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: 🔐 Login to JFrog
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.JFROG_URL }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_PASSWORD }}
      
      - name: 🔨 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:latest
            ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:${{ steps.package.outputs.VERSION }}
            ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: ✔️ Verify image in JFrog
        if: always()
        run: |
          echo "🔍 Verifying image push..."
          
          # Get image metadata
          IMAGE_URL="${{ secrets.JFROG_URL }}/artifactory/api/storage/docker-local/simple-node-app/latest"
          
          echo "Image URL: $IMAGE_URL"
          
          # Verify (with retries)
          for i in {1..5}; do
            echo "Attempt $i..."
            RESPONSE=$(curl -s -w "%{http_code}" \
              -u ${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }} \
              "$IMAGE_URL")
            
            HTTP_CODE="${RESPONSE: -3}"
            
            if [ "$HTTP_CODE" -eq "200" ]; then
              echo "✅ Image verified!"
              echo "${RESPONSE:0:$((${#RESPONSE}-3))}" | jq .
              exit 0
            fi
            
            echo "⏳ Waiting... ($i/5)"
            sleep 5
          done
          
          echo "❌ Could not verify image"
          exit 1
      
      - name: 📊 Create deployment summary
        if: success()
        run: |
          echo "## 🐳 Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ secrets.JFROG_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | docker-local |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | simple-node-app |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.package.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  ################################
  # Optional: Deploy to VM
  ################################
  deploy:
    name: 🚀 Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📍 Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Deployment started..."
            
            # Create app directory
            mkdir -p ~/simple-node-app
            cd ~/simple-node-app
            
            # Pull latest code
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Login to JFrog Docker Registry
            echo "${{ secrets.JFROG_PASSWORD }}" | docker login \
              -u ${{ secrets.JFROG_USERNAME }} \
              --password-stdin \
              ${{ secrets.JFROG_URL }}
            
            # Pull latest image
            docker pull ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:latest
            
            # Stop old container
            docker stop simple-app 2>/dev/null || true
            docker rm simple-app 2>/dev/null || true
            
            # Run new container
            docker run -d \
              --name simple-app \
              -p 3000:3000 \
              --restart unless-stopped \
              ${{ secrets.JFROG_URL }}/docker-local/simple-node-app:latest
            
            # Verify
            sleep 2
            curl -f http://localhost:3000/health || exit 1
            
            echo "✅ Deployment completed!"

  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [build-push]
    if: always()
    
    steps:
      - name: Status Report
        run: |
          if [ "${{ needs.build-push.result }}" = "success" ]; then
            echo "✅ BUILD & PUSH SUCCESSFUL"
            echo "🐳 Image pushed to JFrog Artifactory"
            echo "📍 Registry: ${{ secrets.JFROG_URL }}/docker-local/simple-node-app"
          else
            echo "❌ BUILD & PUSH FAILED"
          fi
