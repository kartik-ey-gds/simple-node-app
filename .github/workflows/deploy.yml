name: 🚀 Deploy Simple Node App to Azure VM


on: 
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ################################
  # STAGE 1: Build & Test
  ################################
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Tests
        run: npm test
      
      - name: Check Code Quality
        run: |
          npm list || true
          echo "✅ Build successful"

  ################################
  # STAGE 2: Deploy to Azure VM
  ################################
  deploy:
    name: 📦 Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 📍 Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: AzureTest
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Deployment started..."
            
            # Create app directory
            mkdir -p ~/simple-node-app
            cd ~/simple-node-app
            
          
            
            # Pull latest code
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Install dependencies
            npm install --production
            
            # Stop old process
            pm2 delete simple-app 2>/dev/null || true
            
            # Start new process
            pm2 start app.js --name "simple-app" -- --port 80
            pm2 save
            
            echo "✅ Deployment completed!"

  ################################
  # STAGE 3: Health Check
  ################################
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Wait for deployment
        run: sleep 5
      
      - name: Check application health
        run: |
          for i in {1..30}; do
            if curl -f http://${{ secrets.AZURE_VM_IP }}/health &>/dev/null; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for application... ($i/30)"
            sleep 2
          done
          echo "❌ Health check failed"
          exit 1

  ################################
  # Notification
  ################################
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "🌍 URL: http://${{ secrets.AZURE_VM_IP }}"
            echo "🏥 Health: http://${{ secrets.AZURE_VM_IP }}/health"
          else
            echo "❌ DEPLOYMENT FAILED"
          fi
