version: '3.9'

services:
  jfrog:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: jfrog-ui
    ports:
      - "8081:8081"
    volumes:
      - jfrog-data:/var/opt/jfrog/artifactory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/artifactory/api/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  jfrog-data:
