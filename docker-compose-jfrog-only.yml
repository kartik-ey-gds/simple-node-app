version: '3.9'

################################
# JFrog Artifactory Only
# Run: docker-compose -f docker-compose-jfrog-only.yml up -d
################################

services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: jfrog-artifactory
    
    ports:
      - "8081:8081"          # Web UI & REST API
      - "8082:8082"          # Docker registry (pull/push)
    
    environment:
      - JF_SHARED_NODE_IP=artifactory
      - JF_SHARED_NODE_ID=artifactory-node
      - JVM_MAX_MEM_PERCENT=75
    
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
      - artifactory-logs:/opt/jfrog/artifactory/var/log
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/artifactory/api/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional: Simple registry UI for browsing images
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: jfrog-registry-ui
    
    ports:
      - "8080:80"
    
    environment:
      - REGISTRY_TITLE=JFrog Docker Registry
      - REGISTRY_URL=http://artifactory:8082
      - DELETE_IMAGES=true
    
    depends_on:
      - artifactory
    
    restart: unless-stopped

volumes:
  artifactory-data:
    driver: local
  artifactory-logs:
    driver: local

networks:
  default:
    name: jfrog-network
    driver: bridge
